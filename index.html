<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Universal AI Chat</title>
  <link href="https://cdn.tailwindcss.com" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/dist/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.5.1/dist/highlight.min.js"></script>
  <style>
    /* Critical CSS for immediate rendering */
    body { font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
    .glass { backdrop-filter: blur(4px); }
    .thinking { animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
<div id="loading" class="fixed inset-0 flex justify-center items-center text-green-500">
  <div>Loading AI Interface...</div>
</div>

<div id="app" class="hidden h-screen flex flex-col" style="display:none;">
  <!-- UI Structure Here -->
</div>

<script>
// Entire Application Code
const APP = {
  settings: {
    apiKey: localStorage.getItem('nvidiaApiKey') || '',
    model: 'meta/llama-3.1-70b-instruct',
    temperature: 0.7,
    maxTokens: 1024,
    darkMode: localStorage.getItem('darkMode') === 'true'
  },
  chats: JSON.parse(localStorage.getItem('chats')) || [],
  currentChat: null,
  init() {
    this.loadUI();
    this.bindEvents();
    this.checkAPIKey();
    this.restoreState();
    document.getElementById('loading').remove();
    document.getElementById('app').classList.remove('hidden');
  },
  // ... (rest of the application logic)
};

APP.init();
</script>
</body>
</html>
